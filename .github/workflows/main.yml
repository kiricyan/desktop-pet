name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压工程压缩包
        run: unzip -o DesktopPetApp.zip -d .

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Debug APK
        working-directory: DesktopPetApp
        run: gradle assembleDebug --stacktrace

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-apk
          path: DesktopPetApp/app/build/outputs/apk/debug/app-debug.apk
